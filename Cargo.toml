[workspace]
members = ["src-tauri"]

[package]
name = "pie-engine"
version = "0.6.2"
edition = "2021"
description = "PIE - Personal Intent Engine: Intelligent middleware between humans and AI models"
license = "Apache-2.0"
repository = "https://github.com/abhishekswe/personal-intent-engine"
authors = ["Abhishek Kumar"]

[lib]
name = "pie_engine"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "pie-cli"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
# Audio capture
cpal = "0.16"
rubato = "0.16"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["sync", "fs", "io-util", "rt-multi-thread", "macros", "time"] }

# HTTP client (for LLM API calls)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"

# Object-safe async traits (LlmClient seam)
async-trait = "0.1"

# CLI
clap = { version = "4", features = ["derive"], optional = true }

# File-based storage
dirs = "6"

# Local SQLite store for transcription history (bundled = no system dep).
rusqlite = { version = "0.32", features = ["bundled"] }

# ONNX runtime + ndarray for the vendored Silero VAD engine (see
# src/audio/silero_vad_engine.rs). Optional, feature-gated.
ort = { version = "=2.0.0-rc.12", optional = true }
ndarray = { version = "0.17", optional = true }

# Tokenizer for the Moonshine STT engine (decodes generated token ids to
# text). default-features = false avoids pulling in an http client.
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

[features]
default = ["cli"]
cli = ["dep:clap"]
# On-device speech-to-text (Moonshine ONNX) + the Silero VAD engine. Named for
# historical reasons; enables the `ort`/`tokenizers`/`ndarray` STT stack.
vad = ["dep:ort", "dep:ndarray", "dep:tokenizers"]

[dev-dependencies]
# Test-only WAV reader for the Moonshine STT fixtures — not shipped.
hound = "3"

[profile.release]
opt-level = 3
lto = true
